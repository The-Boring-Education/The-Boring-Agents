[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-boring-agents"
version = "0.1.0"
description = "AI-powered content generation API for The Boring Education platform"
readme = "readme.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "The Boring Education"}
]

dependencies = [
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-openai>=0.0.8",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.1",
    "python-slugify>=8.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "httpx>=0.24.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
]

[project.scripts]
agents-api = "src.api.app:create_app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "api: marks tests as API tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/__init__.py",
    "*/test_*.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 50

# ---------------------------------------------------------------------------
# Ruff (linter + formatter — replaces black, isort, flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py39"
src = ["src", "tests"]
exclude = [".venv", "output", "logs", "temp", "__pycache__"]

[tool.ruff.lint]
select = [
    "F",   # Pyflakes — unused imports, undefined names
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort — import ordering
    "UP",  # pyupgrade — modernise syntax
    "B",   # bugbear — common bugs & design problems
]
ignore = [
    "E501",   # line too long (let the formatter handle soft-wrapping)
    "E712",   # comparison to True/False
    "UP006",  # use `dict` instead of `Dict` — too noisy for existing code on py3.9
    "UP035",  # deprecated typing imports — related to UP006
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

